<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Think Before You Post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout concept: a dark cyber-investigation dossier that scrolls through five challenges, then turns bright for the "take control" section. Single dark look by choice, brightened in the final section. */
:root{
  --bg:#080B12; --bg2:#101827; --panel:rgba(16,24,39,.74); --panel2:#0c1322;
  --line:rgba(160,185,220,.16); --line-strong:rgba(0,229,255,.38);
  --text:#F5F7FA; --muted:#9CA3AF;
  --cyan:#00E5FF; --purple:#8B5CF6; --red:#FF4545; --green:#22C55E; --amber:#F5B83D;
  --on-accent:#04141A; --glow:0 0 24px rgba(0,229,255,.28);
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --nav-h:64px; color-scheme:dark;
}
.bright{ --bg:#EEF7FA; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#F3FAFC; --line:rgba(8,11,18,.13); --line-strong:rgba(14,116,144,.5);
  --text:#0B1220; --muted:#475569; --cyan:#0E7490; --purple:#6D28D9; --red:#B91C1C; --green:#15803D; --amber:#B45309;
  --on-accent:#FFFFFF; --glow:0 6px 20px rgba(14,116,144,.25); }
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.18),transparent 60%),radial-gradient(700px 500px at -5% 25%,rgba(0,229,255,.10),transparent 60%),
  linear-gradient(rgba(0,229,255,.04) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(0,229,255,.04) 1px,transparent 1px) 0 0/48px 48px;
  animation:gridpan 40s linear infinite}
@keyframes gridpan{to{background-position:0 0,0 0,0 48px,48px 0}}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.1;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--cyan)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:4px}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-inline:20px}
.ic{width:1.25em;height:1.25em;flex:none}
.skip{position:absolute;left:-999px;top:0;background:var(--cyan);color:var(--on-accent);padding:10px 16px;z-index:100;font-weight:700}
.skip:focus{left:8px;top:8px}
section[id]{scroll-margin-top:calc(var(--nav-h) + 6px + env(safe-area-inset-top,0px))}
.sec{padding-block:clamp(56px,9vw,100px)}
.mono{font-family:var(--font-mono)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(8,11,18,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:14px;min-height:var(--nav-h)}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font:700 .95rem/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand .ic{color:var(--cyan);width:1.5em;height:1.5em}
.links{display:none;gap:2px;margin-inline:auto}
.links a,.menu a{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:8px;font-size:.9rem;font-weight:500}
.links a:hover,.menu a:hover{color:var(--text);background:rgba(255,255,255,.05)}
.links a.on,.menu a.on{color:var(--cyan)}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.links+.nav-right{margin-left:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:999px;font:700 .8rem var(--font-mono);color:var(--cyan);white-space:nowrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{background:transparent;border:0;padding:7px 11px;font:700 .78rem var(--font-mono);color:var(--muted);min-height:36px}
.lang button[aria-pressed="true"]{background:var(--cyan);color:var(--on-accent)}
.burger{background:transparent;border:1px solid var(--line);border-radius:8px;width:40px;height:40px;display:grid;place-items:center}
.nav-bar{height:3px;background:var(--line)}
.nav-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--purple));transition:width .5s}
.menu{display:none;padding:8px 12px 16px;border-top:1px solid var(--line);background:rgba(8,11,18,.97)}
.menu a{display:block;padding:12px}
@media(min-width:1020px){.links{display:flex}.burger{display:none}.nav-right{margin-left:0}}
@media(max-width:1019px){.menu:not([hidden]){display:block}}
@media(max-width:420px){.brand span{display:none}.pill{padding:6px 9px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 24px;border-radius:10px;border:1px solid transparent;font:700 .92rem var(--font-display);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;transition:transform .15s,box-shadow .2s,background .2s;text-align:center}
.btn-primary{background:var(--cyan);color:var(--on-accent);box-shadow:var(--glow)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 0 34px rgba(0,229,255,.45)}
.bright .btn-primary:hover{box-shadow:0 10px 26px rgba(14,116,144,.35)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--line-strong)}
.btn-ghost:hover{background:rgba(0,229,255,.08)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-sm{min-height:38px;padding:8px 14px;font-size:.78rem}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}

/* hero */
.hero{position:relative;overflow:hidden;padding-block:clamp(40px,7vw,84px)}
#particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:1fr;gap:32px;align-items:center}
@media(min-width:920px){.hero-in{grid-template-columns:1.05fr .95fr}}
.kicker{display:inline-flex;align-items:center;gap:10px;font:500 .78rem var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:18px}
.kicker .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.hero h1{font-size:clamp(2.7rem,8.2vw,5.6rem);font-weight:700;letter-spacing:-.03em;line-height:1}
.hero h1 span{display:block}
.grad{background:linear-gradient(95deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(1.05rem,2.2vw,1.3rem);margin-top:22px;max-width:34em}
.lead2{color:var(--muted);margin-top:14px;max-width:36em}
.hero .btn-row{margin-top:28px}
.fine{display:flex;gap:10px;align-items:flex-start;margin-top:22px;color:var(--muted);font-size:.85rem;max-width:36em}
.fine .ic{margin-top:2px;color:var(--cyan)}
.hero-art svg{width:100%;height:auto;max-height:520px;display:block}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-9px)}}
.flow{stroke-dasharray:4 6;animation:dash 2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.svg-label{font:600 10.5px var(--font-mono);fill:#9CA3AF;letter-spacing:.08em}
.scan-rect{animation:scanY 3.2s ease-in-out infinite alternate}
@keyframes scanY{from{transform:translateY(0)}to{transform:translateY(120px)}}
.tagline{font:600 clamp(1.15rem,2.6vw,1.6rem)/1.35 var(--font-display);max-width:30em;margin-block:8px 36px;padding-left:18px;border-left:3px solid var(--purple)}

/* cards */
.cards{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:700px){.cards{grid-template-columns:repeat(6,1fr)}.card{grid-column:span 2}.card:nth-child(n+4){grid-column:span 3}}
@media(min-width:1100px){.cards{grid-template-columns:repeat(5,1fr)}.card,.card:nth-child(n+4){grid-column:span 1}}
.card{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);border-color:var(--line-strong);box-shadow:0 10px 30px rgba(0,229,255,.1)}
.card-top{display:flex;justify-content:space-between;align-items:center;color:var(--cyan)}
.card-top .ic{width:2em;height:2em}
.card-n{font:500 .78rem var(--font-mono);color:var(--muted)}
.card h3{font-size:1.05rem;letter-spacing:.06em}
.card p{color:var(--muted);font-size:.92rem;flex:1}
.card-go{display:inline-flex;align-items:center;gap:8px;font:700 .8rem var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--cyan)}
.card.is-done{border-color:rgba(34,197,94,.5)}
.card.is-done .card-top{color:var(--green)}
.card.is-done .card-go{color:var(--green)}
.prog{margin-top:20px;display:grid;gap:12px}
.prog-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 .85rem var(--font-mono);color:var(--muted)}
.prog-top b{color:var(--cyan)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:99px;transition:width .6s}

/* panels and section heads */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(16px,3vw,28px);min-width:0}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font:500 .74rem var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:14px}
.badge-done{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:rgba(34,197,94,.14);color:var(--green);border:1px solid rgba(34,197,94,.4);letter-spacing:.08em}
.statement{font-size:clamp(1.55rem,4.2vw,2.7rem);font-weight:700;max-width:20em}
.intro{color:var(--muted);max-width:42em;margin-top:16px;font-size:1.05rem}
.sec-head{margin-bottom:32px}
.takeaway{display:flex;gap:16px;align-items:flex-start;margin-top:32px;padding:20px 22px;border-radius:12px;border:1px solid var(--line-strong);background:linear-gradient(135deg,rgba(0,229,255,.10),rgba(139,92,246,.12))}
.takeaway .ic{color:var(--cyan);width:1.8em;height:1.8em;margin-top:2px}
.takeaway small{display:block;font:700 .72rem var(--font-mono);letter-spacing:.14em;color:var(--cyan);margin-bottom:6px;text-transform:uppercase}
.takeaway p{font-size:1.05rem}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;font:700 .68rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.tag-sim{background:rgba(245,184,61,.14);color:var(--amber);border:1px solid rgba(245,184,61,.45)}
.tag-fic{background:rgba(139,92,246,.16);color:#c4b5fd;border:1px solid rgba(139,92,246,.5)}
.notice{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:.88rem}
.notice .ic{color:var(--amber);margin-top:2px}

/* face */
.two{display:grid;gap:32px;grid-template-columns:1fr;align-items:center}
@media(min-width:880px){.two{grid-template-columns:.9fr 1.1fr}}
.face-art svg{width:100%;max-width:380px;height:auto;display:block;margin-inline:auto}
.demo{margin-top:36px}
.demo-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.shots{position:relative;display:grid;gap:14px;grid-template-columns:1fr;overflow:hidden;border-radius:10px}
@media(min-width:640px){.shots{grid-template-columns:repeat(3,1fr)}}
.shot{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2);min-width:0}
.shot svg{display:block;width:100%;height:auto;max-height:230px}
.shot figcaption{padding:10px 12px;font-size:.85rem;color:var(--muted)}
.shot figcaption b{display:block;color:var(--text)}
.shot .host{font:400 .74rem var(--font-mono)}
.match{display:none;padding:8px 12px;font:700 .72rem var(--font-mono);letter-spacing:.06em;color:var(--green);background:rgba(34,197,94,.12);border-top:1px solid rgba(34,197,94,.4)}
.shots.done .match{display:block;animation:rise .5s both}
.shots.done .shot{border-color:rgba(34,197,94,.5)}
.lm{opacity:0}.done .lm{opacity:1}
.scanline{display:none;position:absolute;top:0;bottom:0;width:3px;left:0;background:var(--cyan);box-shadow:0 0 22px 6px rgba(0,229,255,.55);pointer-events:none}
.shots.scanning .scanline{display:block;animation:sweep 2.4s linear forwards}
@keyframes sweep{from{left:0}to{left:calc(100% - 3px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.demo-foot{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:18px}
.status{font:500 .9rem var(--font-mono);color:var(--muted)}
.status.ok{color:var(--green)}

/* modal and toast */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(3,5,10,.78);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .2s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#0d1524;border:1px solid var(--line-strong);border-radius:16px;max-width:600px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:clamp(20px,4vw,32px);box-shadow:0 0 60px rgba(0,229,255,.14);animation:rise .3s both}
.modal h2{font-size:1.5rem;margin-bottom:12px}
.modal ul{margin:16px 0 22px;padding:0;list-style:none;display:grid;gap:12px}
.modal li{display:flex;gap:12px;color:#d6dbe4}
.modal li .ic{color:var(--cyan);margin-top:3px}
.modal .how li b{display:block;color:var(--text);font-family:var(--font-display)}
#toast{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;justify-content:center;padding-inline:16px;pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#0d1524;border:1px solid rgba(34,197,94,.55);color:var(--text);padding:12px 16px;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:rise .3s both;font-size:.92rem}
.toast .ic{color:var(--green)}

/* password terminal */
.term{background:#05080e;border:1px solid var(--line);border-radius:10px;font-family:var(--font-mono);overflow:hidden}
.term-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0a1019;color:var(--muted);font-size:.74rem}
.term-bar i{width:10px;height:10px;border-radius:50%;background:#2a3547}
.term-bar span{margin-left:8px}
.term-body{padding:clamp(14px,3vw,24px);display:grid;gap:20px}
.prompt{color:var(--green);font-size:.85rem}
.prompt em{color:var(--muted);font-style:normal}
.profile{display:grid;gap:14px;grid-template-columns:1fr;border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--panel2)}
@media(min-width:620px){.profile{grid-template-columns:auto 1fr}}
.profile .av{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));display:grid;place-items:center;color:#fff}
.profile .av .ic{width:2.6em;height:2.6em}
.profile dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px}
.profile dt{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.profile dd{margin:0;font-size:.95rem;color:var(--text)}
.profile h3{grid-column:1/-1;font-size:1.15rem}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:rgba(255,69,69,.1);border:1px solid rgba(255,69,69,.5);color:#ff9a9a;border-radius:8px;padding:10px 14px;font:700 1rem var(--font-mono);animation:rise .5s both;min-height:44px}
.chip[aria-pressed="true"]{background:rgba(255,69,69,.22);color:#fff}
.chain{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.link-box{flex:1 1 150px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel2);animation:rise .5s both}
.link-box small{display:block;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.link-box b{font-size:.95rem;overflow-wrap:anywhere}
.link-box.last{border-color:rgba(255,69,69,.6);background:rgba(255,69,69,.08)}
.link-box.last b{color:#ff8a8a}
.arrow{display:grid;place-items:center;color:var(--cyan);flex:0 0 22px}
@media(max-width:700px){.arrow{flex:1 1 100%;transform:rotate(90deg);height:18px}}
.cmp{display:grid;gap:14px;grid-template-columns:1fr;margin-top:28px}
@media(min-width:760px){.cmp{grid-template-columns:repeat(3,1fr)}}
.cmp-card{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--panel);display:grid;gap:10px;align-content:start;min-width:0}
.cmp-card h4{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-family:var(--font-mono)}
.cmp-card.weak{border-color:rgba(255,69,69,.55)}.cmp-card.weak h4{color:var(--red)}
.cmp-card.better{border-color:rgba(0,229,255,.5)}.cmp-card.better h4{color:var(--cyan)}
.cmp-card.best{border-color:rgba(34,197,94,.55)}.cmp-card.best h4{color:var(--green)}
.cmp-card .eg{font:500 .85rem var(--font-mono);color:var(--muted)}
.quiz{margin-top:28px}
.quiz h3{font-size:1.25rem;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);transition:border-color .2s,background .2s}
.opt:hover:not([disabled]){border-color:var(--line-strong);background:rgba(0,229,255,.06)}
.opt .l{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 .85rem var(--font-mono);border:1px solid var(--line-strong);color:var(--cyan)}
.opt small{display:block;margin-top:6px;color:var(--muted);font-size:.86rem}
.opt.correct{border-color:var(--green);background:rgba(34,197,94,.1)}
.opt.correct .l{background:var(--green);color:#04140a;border-color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(255,69,69,.1)}
.opt.wrong .l{background:var(--red);color:#fff;border-color:var(--red)}
.opt[disabled]{cursor:default}
.fb{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px 16px;border-radius:10px;border:1px solid;animation:rise .4s both}
.fb.good{border-color:var(--green);background:rgba(34,197,94,.1)}.fb.good .ic{color:var(--green)}
.fb.bad{border-color:var(--red);background:rgba(255,69,69,.1)}.fb.bad .ic{color:var(--red)}
.fb b{display:block}

/* posts */
.meter{position:sticky;top:calc(var(--nav-h) + 3px + 8px + env(safe-area-inset-top,0px));z-index:10;display:grid;gap:8px;padding:12px 16px;border-radius:12px;border:1px solid var(--line-strong);background:rgba(10,16,26,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-bottom:20px}
.meter-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:700 .74rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.meter-bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.meter-bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .5s,background .3s;background:var(--green)}
.meter.l1 .meter-bar i{background:var(--amber)}.meter.l2 .meter-bar i{background:var(--red)}
.meter .lvl{font:500 .9rem var(--font-body);text-transform:none;letter-spacing:0;color:var(--text)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}

function startParticles(){
 cancelAnimationFrame(pRAF);
 const c=document.getElementById('particles');if(!c||RM)return;
 const ctx=c.getContext('2d');if(!ctx)return;
 let W=0,H=0;const pts=[];
 const r0=c.parentElement.getBoundingClientRect();W=r0.width;H=r0.height;
 const d=Math.min(window.devicePixelRatio||1,2);c.width=W*d;c.height=H*d;ctx.setTransform(d,0,0,d,0,0);
 const N=Math.round(Math.min(48,W/22));
 for(let i=0;i<N;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.4+.6,c:Math.random()<.3?'139,92,246':'0,229,255'});
 function tick(){
  pRAF=requestAnimationFrame(tick);
  if(document.hidden)return;
  const b=c.getBoundingClientRect();if(!b.width||b.bottom<0||b.top>window.innerHeight)return;
  ctx.clearRect(0,0,W,H);
  for(let i=0;i<pts.length;i++){
   const p=pts[i];p.x+=p.vx;p.y+=p.vy;
   if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
   ctx.fillStyle='rgba('+p.c+',.7)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.2832);ctx.fill();
   for(let j=i+1;j<pts.length;j++){
    const q=pts[j],dx=p.x-q.x,dy=p.y-q.y,dd=dx*dx+dy*dy;
    if(dd<12100){ctx.strokeStyle='rgba(0,229,255,'+(.16*(1-dd/12100)).toFixed(3)+')';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}
   }
  }
 }
 tick();
}

 +'<div class="panel score"><div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54" fill="none" stroke-width="10"/><circle class="fg" id="ringFg" cx="60" cy="60" r="54" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-p/100)).toFixed(1)+'"/></svg><b id="ringPct">'+p+'%</b></div>'
 +'<div><h3>'+s.scoreTitle+'</h3><p class="msg" id="privMsg" aria-live="polite">'+privMsg(p)+'</p><small id="privCount">'+fmt(s.count,{n:S.checks.length})+'</small><small style="margin-top:6px">'+s.disclaimer+'</small>'
 +'<div style="margin-top:16px">'+(S.privDone?'<span class="badge-done tag">'+ic('check')+s.finished+'</span>':'<button class="btn btn-primary" data-action="privFinish">'+s.finish+'</button>')+'</div></div></div>'
 +takeaway(s.takeaway)+'</div>';
}
function updatePrivScore(){
 const p=privPct(),s=L().priv;
 const fg=$('#ringFg');if(fg)fg.setAttribute('stroke-dashoffset',(339.29*(1-p/100)).toFixed(1));
 const a=$('#ringPct');if(a)a.textContent=p+'%';
 const m=$('#privMsg');if(m)m.textContent=privMsg(p);
 const c=$('#privCount');if(c)c.textContent=fmt(s.count,{n:S.checks.length});
}

/* ---------- complete / foot ---------- */
/* ---------- final page and badge ---------- */
let dl=null;
const dispName=()=>S.badgeName||'';
function renderFinal(){
 const f=L().final,c=L().complete;
 const badge=S.badgeName?'<canvas id="badge" class="badge-cv" width="900" height="1200" role="img" aria-label="'+esc(S.badgeName)+'"></canvas><div class="btn-row" style="justify-content:center">'+(dl?'<button class="btn btn-primary" data-action="badgeSave">'+ic('image')+f.save+'</button>':'')+'</div><p class="status" id="saveStatus" role="status">'+(dl?'':f.saveHint)+'</p>':'<p class="status" id="saveStatus" role="status"></p>';
 $('#final').innerHTML='<div class="wrap"><div class="done-card"><span class="tag" style="background:rgba(34,197,94,.14);color:var(--green);border:1px solid rgba(34,197,94,.5)">'+ic('check')+'5 / 5</span>'
 +'<h2 class="grad" tabindex="-1">'+f.title+'</h2><p class="intro" style="margin:0">'+f.text+'</p>'
 +'<div class="rules">'+c.rules.map((r,i)=>'<div class="rule"><span class="n">0'+(i+1)+'</span><p>'+r+'</p></div>').join('')+'</div>'
 +'<p class="final-line">'+c.final+'</p>'
 +'<div class="panel badge-panel"><h3>'+f.badgeTitle+'</h3><p class="notice" style="justify-content:center;text-align:left">'+ic('lock')+'<span>'+f.badgeText+'</span></p>'
 +'<div class="name-row"><label for="nameInput" class="vh">'+f.nameLabel+'</label><input id="nameInput" type="text" maxlength="40" autocomplete="off" placeholder="'+esc(f.namePh)+'" value="'+esc(S.nameDraft)+'"><button class="btn btn-primary" data-action="badgeMake">'+f.make+'</button></div>'
 +badge+'</div>'
 +'<div class="btn-row" style="justify-content:center"><button class="btn btn-ghost" data-action="go" data-target="home">'+ic('arrow','flip')+L().backHome+'</button><button class="btn btn-ghost" data-action="replay">'+ic('reset')+c.replay+'</button></div></div></div>';
 drawBadge();
}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawBadge(){
 const cv=document.getElementById('badge');if(!cv||!S.badgeName)return;
 const run=()=>{
  const b=L().final.badge,fin=L().complete.final,ctx=cv.getContext('2d'),W=900,H=1200;
  const D='"Space Grotesk","Inter",system-ui,sans-serif',M='"JetBrains Mono",ui-monospace,monospace';
  const up=s=>s.toLocaleUpperCase(lang==='tr'?'tr-TR':'en-US');
  const fit=(t,max,start,min,w,fam)=>{let s=start;ctx.font=w+' '+s+'px '+fam;while(ctx.measureText(t).width>max&&s>min){s-=2;ctx.font=w+' '+s+'px '+fam;}return s;};
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#080B12');g.addColorStop(1,'#16213a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,229,255,.07)';ctx.lineWidth=1;
  for(let x=0;x<=W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.strokeStyle='#00E5FF';ctx.lineWidth=6;rr(ctx,36,36,W-72,H-72,36);ctx.stroke();
  ctx.strokeStyle='rgba(139,92,246,.75)';ctx.lineWidth=2;rr(ctx,58,58,W-116,H-116,26);ctx.stroke();
  ctx.save();ctx.translate(450-12*15,130-3*15);ctx.scale(15,15);
  const sg=ctx.createLinearGradient(4,3,20,21);sg.addColorStop(0,'#00E5FF');sg.addColorStop(1,'#8B5CF6');
  ctx.fillStyle=sg;ctx.fill(new Path2D('M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z'));
  ctx.strokeStyle='#080B12';ctx.lineWidth=1.8;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke(new Path2D('M9 12l2 2 4-4'));ctx.restore();
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillStyle='#F5F7FA';fit(up(b.top),W-200,50,28,'700',D);ctx.fillText(up(b.top),450,520);
  ctx.fillStyle='#00E5FF';fit(up(b.sub),W-200,28,16,'500',M);ctx.fillText(up(b.sub),450,572);
  ctx.strokeStyle='rgba(160,185,220,.3)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(200,620);ctx.lineTo(700,620);ctx.stroke();
  ctx.fillStyle='#9CA3AF';ctx.font='500 26px '+M;ctx.fillText(up(b.to),450,682);
  const nm=up(S.badgeName);ctx.fillStyle='#FFFFFF';fit(nm,W-190,88,34,'700',D);ctx.fillText(nm,450,780);
  const dn=up(b.done);ctx.font='700 28px '+M;const dw=ctx.measureText(dn).width+70;
  ctx.fillStyle='rgba(34,197,94,.16)';rr(ctx,450-dw/2,832,dw,64,32);ctx.fill();ctx.strokeStyle='#22C55E';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#22C55E';ctx.fillText(dn,450,875);
  for(let i=0;i<5;i++){const x=450+(i-2)*90;ctx.beginPath();ctx.arc(x,972,30,0,6.2832);ctx.fillStyle='rgba(34,197,94,.18)';ctx.fill();ctx.strokeStyle='#22C55E';ctx.lineWidth=3;ctx.stroke();
   ctx.beginPath();ctx.moveTo(x-12,972);ctx.lineTo(x-3,982);ctx.lineTo(x+13,962);ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
  let ds='';try{ds=new Date().toLocaleDateString(lang==='tr'?'tr-TR':'en-GB',{day:'numeric',month:'long',year:'numeric'});}catch(e){}
  ctx.fillStyle='#9CA3AF';ctx.font='500 26px '+M;ctx.fillText(ds,450,1050);
  ctx.fillStyle='#F5F7FA';fit(fin,W-190,30,16,'700',D);ctx.fillText(fin,450,1118);
 };
 if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('700 40px "Space Grotesk"'),document.fonts.load('500 24px "JetBrains Mono"')]).then(run,run);}else run();
}
function makeBadge(){
 const n=S.nameDraft.replace(/\s+/g,' ').trim().slice(0,40);
 if(!n){const st=$('#saveStatus');if(st)st.textContent=L().final.needName;refocus('#nameInput');return;}
 S.badgeName=n;renderFinal();
 const cv=document.getElementById('badge');if(cv)cv.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});
}
function saveBadge(){
 const cv=document.getElementById('badge'),st=$('#saveStatus');if(!cv||!dl)return;
 cv.toBlob(blob=>{
  if(!blob){if(st)st.textContent=L().final.saveFail;return;}
  dl.save({filename:'think-before-you-post-badge.png',data:blob}).then(()=>{if(st)st.textContent=L().final.saved;}).catch(e=>{if(st)st.textContent=(e&&e.code==='declined')?'':L().final.saveFail;});
 },'image/png');
}
function renderFoot(){$('#foot').textContent=L().foot;$('#skip').textContent=L().meta.skip;}

const VIEWS=['home','face','pass','posts','scam','priv','final'];
function setView(v,keep){
 if(v==='priv'&&!unlocked()&&!S.done.priv){toast(L().lockedNote,null,null,'lock');return;}
 if(v==='final'&&!allDone()){toast(L().lockedNote,null,null,'lock');return;}
 S.view=v;
 VIEWS.forEach(id=>{const el=document.getElementById(id);if(el)el.hidden=id!==v;});
 if(v==='final')renderFinal();
 if(v==='home')startParticles();
 if(!keep){
  window.scrollTo({top:0,behavior:'auto'});
  const h=document.querySelector('#'+v+' h1, #'+v+' h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}
 }
}
const goTo=setView;

function renderAll(){
 document.documentElement.lang=lang;
 renderNav();renderHome();renderFace();renderPass();renderPosts();renderScam();renderPriv();renderFoot();renderModal();
 setView(S.view,true);
}

/* ---------- events ---------- */
function replay(){
 clearTimeout(simT);
 Object.assign(S,fresh());
 renderAll();
 setView('home');
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el)return;
 const a=el.getAttribute('data-action'),d=el.dataset;
 if(a==='scrim'&&e.target!==el)return;
 if(el.tagName==='A'&&a==='go')e.preventDefault();
 switch(a){
  case 'go':if(S.modal){S.modal=null;renderModal();}setView(d.target);break;
  case 'scrim':closeModal();break;
  case 'lang':lang=d.l;try{localStorage.setItem('tbyp-lang',lang);}catch(x){}renderAll();refocus(lang==='en'?'#langEn':'#langTr');break;
  case 'next':setView(nextTarget(d.from)||'home');break;
  case 'how':openModal('how');break;
  case 'start':S.modal=null;renderModal();setView('face');break;
  case 'badgeMake':makeBadge();break;
  case 'badgeSave':saveBadge();break;
  case 'faceOpen':openModal('face');complete('face');break;
  case 'faceClose':closeModal();break;
  case 'faceSim':runFaceSim();break;
  case 'pwReveal':S.pwOpen=true;renderPass();break;
  case 'pwPick':S.pwIdx=+d.i;renderPass();refocus('[data-action="pwPick"][data-i="'+d.i+'"]');break;
  case 'pwNext':S.pwIdx=(S.pwIdx+1)%PATTERNS.length;renderPass();refocus('[data-action="pwNext"]');break;
  case 'pwAnswer':if(S.pwAns===null){S.pwAns=+d.i;renderPass();complete('pass');}break;
  case 'postToggle':{const i=S.sel.indexOf(d.id);if(i>=0)S.sel.splice(i,1);else S.sel.push(d.id);renderPosts();refocus('[data-id="'+d.id+'"]');break;}
  case 'postFinish':S.postsDone=true;renderPosts();complete('posts');break;
  case 'scamTab':S.scamIdx=+d.i;renderScam();refocus('#tab'+d.i);break;
  case 'scamPick':if(S.scamAns[S.scamIdx]===null){S.scamAns[S.scamIdx]=+d.i;renderScam();if(scamAnswered()===3)complete('scam');}break;
  case 'scamNext':{const n=S.scamAns.findIndex(v=>v===null);S.scamIdx=n>=0?n:Math.min(2,S.scamIdx+1);renderScam();refocus('#tab'+S.scamIdx);break;}
  case 'privFinish':S.privDone=true;renderPriv();complete('priv');setView('final');break;
  case 'replay':replay();break;
 }
});
document.addEventListener('change',e=>{
 const el=e.target;if(!el.matches||!el.matches('[data-check]'))return;
 const i=+el.getAttribute('data-check'),k=S.checks.indexOf(i);
 if(el.checked&&k<0)S.checks.push(i);else if(!el.checked&&k>=0)S.checks.splice(k,1);
 updatePrivScore();
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='nameInput')S.nameDraft=e.target.value;});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target&&e.target.id==='nameInput'){e.preventDefault();S.nameDraft=e.target.value;makeBadge();return;}
 if(e.key==='Escape'&&S.modal){closeModal();return;}
 if(e.key==='Tab'&&S.modal){
  const m=document.querySelector('.modal');if(!m)return;
  const f=[].slice.call(m.querySelectorAll('a[href],button:not([disabled])'));if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&(document.activeElement===first||document.activeElement===m)){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
 }
});
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(startParticles,250);});

const withBar=(fn,key)=>function(){fn();refreshBar(key);};
renderFace=withBar(renderFace,'face');
renderPass=withBar(renderPass,'pass');
renderPosts=withBar(renderPosts,'posts');
renderScam=withBar(renderScam,'scam');

renderAll();
if(window.claude&&typeof window.claude.use==='function'){
 window.claude.use('downloads').then(d=>{dl=d||null;if(dl&&S.view==='final')renderFinal();}).catch(()=>{});
}
})();
</script>
